<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #1a1a2e; color: #eee; padding: 1rem; }
    .card { background: #16213e; border-radius: 12px; padding: 1.5rem 2rem; max-width: 360px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    h1 { margin: 0 0 1.25rem; font-size: 1.5rem; font-weight: 600; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.9rem; }
    input[type="number"], input[type="range"] { width: 100%; margin-bottom: 1rem; padding: 0.5rem; font-size: 1rem; border-radius: 6px; border: 1px solid #0f3460; background: #0f3460; color: #eee; }
    input[type="range"] { padding: 0; accent-color: #e94560; }
    .row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    .row input[type="number"] { flex: 0 0 80px; margin: 0; }
    button { width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; background: #e94560; color: #fff; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #ff6b6b; }
    .result { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #0f3460; font-size: 1.1rem; }
    .result div { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    .result .total { font-weight: 700; font-size: 1.25rem; color: #e94560; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tip Calculator</h1>
    <!-- Bill amount input -->
    <label for="bill">Bill amount ($)</label>
    <input type="number" id="bill" placeholder="0.00" min="0" step="0.01">
    <!-- Tip percentage: slider and number stay in sync -->
    <label for="tipSlider">Tip percentage</label>
    <div class="row">
      <input type="range" id="tipSlider" min="0" max="50" value="15">
      <input type="number" id="tipPercent" min="0" max="100" value="15" style="width: 4rem;">
      <span>%</span>
    </div>
    <button type="button" id="calcBtn">Calculate</button>
    <!-- Results: tip and total -->
    <div class="result">
      <div><span>Tip amount</span><span id="tipOut">$0.00</span></div>
      <div class="total"><span>Total</span><span id="totalOut">$0.00</span></div>
    </div>
  </div>

  <script>
    // Get all elements we need
    const billInput = document.getElementById('bill');
    const tipSlider = document.getElementById('tipSlider');
    const tipPercent = document.getElementById('tipPercent');
    const calcBtn = document.getElementById('calcBtn');
    const tipOut = document.getElementById('tipOut');
    const totalOut = document.getElementById('totalOut');

    // Keep slider and number input in sync
    tipSlider.addEventListener('input', () => { tipPercent.value = tipSlider.value; });
    tipPercent.addEventListener('input', () => { tipSlider.value = Math.min(100, Math.max(0, tipPercent.value || 0)); });

    // Calculate tip and total when button is clicked
    function calculate() {
      const bill = parseFloat(billInput.value) || 0;
      const percent = parseFloat(tipPercent.value) || 0;
      const tip = (bill * percent) / 100;
      const total = bill + tip;
      tipOut.textContent = '$' + tip.toFixed(2);
      totalOut.textContent = '$' + total.toFixed(2);
    }
    calcBtn.addEventListener('click', calculate);
  </script>
</body>
</html>
